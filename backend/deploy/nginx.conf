# ==============================================================================
# Nexia Production Reverse Proxy Configuration (Nginx)
# ==============================================================================
# Features:
# - Reverse proxy to FastAPI backend (default port 8000)
# - Server-Sent Events (SSE) streaming support without buffering
# - High-performance Gzip compression for JSON and static content
# - Extended read timeouts for CPU-based local LLM generation
# - Protection against oversized payloads
# ==============================================================================

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Request size limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        image/svg+xml;

    upstream nexia_backend {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard API and Web routes
        location / {
            proxy_pass http://nexia_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Dedicated Server-Sent Events (SSE) Streaming Route
        # CRITICAL: Disable proxy_buffering and chunked transfer encoding so tokens stream progressively
        location ~ ^/api/v1/retrieval/answer/stream {
            proxy_pass http://nexia_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable proxy buffering for immediate token transmission
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;

            # Extended read timeout for local LLM inference
            proxy_connect_timeout 10s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}

